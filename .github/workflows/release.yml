name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: rmap
            archive: tar.gz

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: rmap
            archive: tar.gz
            musl: true

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin: rmap
            archive: tar.gz
            use_cross: true

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: rmap.exe
            archive: zip

          - os: macos-13
            target: x86_64-apple-darwin
            bin: rmap
            archive: tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            bin: rmap
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross == true
        uses: taiki-e/install-action@cross

      - name: Install musl-tools
        if: matrix.musl == true
        run: sudo apt-get install -y musl-tools

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Strip binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          strip "$BIN" || true

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          ARCHIVE="rmap-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          mkdir -p _dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" _dist/
          cp README.md _dist/
          tar -czf "$ARCHIVE" -C _dist "${{ matrix.bin }}" README.md
          rm -rf _dist
          echo "ASSET=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ARCHIVE = "rmap-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive `
            -Path "target\${{ matrix.target }}\release\${{ matrix.bin }}", "README.md" `
            -DestinationPath $ARCHIVE
          "ASSET=$ARCHIVE" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
