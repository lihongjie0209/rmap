[package]
name = "rmap"
version = "0.2.1"
edition = "2021"

[[bin]]
name = "rmap"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
socket2 = { version = "0.5", features = ["all"] }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
ipnetwork = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures = "0.3"
ratatui = "0.29"
crossterm = "0.28"
fancy-regex = "0.13"
once_cell = "1"
